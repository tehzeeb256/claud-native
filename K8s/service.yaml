apiVersion: v1
kind: Service
metadata:
  name: claud-native-service
  labels:
    app: claud-native

spec: 
# type : nodeport
  type: NodePort

  # WebSockets Sticky Session (Taaki peers same RAM context se connect hon)
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

# selector for pods
  selector:
    app: claud-native

# ports configuration
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30080
