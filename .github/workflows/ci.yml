name : CI pipeline 

# Trigger 

on:
  push:
  branches: [main]
  pull _request:
    branches: [main]

jobs:

# job 1 : run tests
 test:
    name: run unit tests
    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: setup python 3.12
      uses: actions/setup-python@v5
      with:
       python-version: "3.12"
       cache: "pip"


     - name: install dependencies
      run: | 
       python -m pip install --upgrade pip
       pip install -r requirements.txt


      - name: run pytest
      run: | 
        pytest

# job 2 : docker image build 
build-docker:
  name: build docker image
  needs: test   
  runs-on: ubuntu-latest

  steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: build docker image
      run: | 
      docker build -t claud-native:latest .